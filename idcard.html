<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Student ID Card - NAS Computer Academy</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#eef3f8;
    color:#172033;
    min-height:100vh;
}

.header{
    background:linear-gradient(
        135deg,
        #071a33,
        #123f70
    );
    color:white;
    text-align:center;
    padding:22px 15px;
}

.header h1{
    font-size:23px;
}

.header p{
    margin-top:6px;
    color:#dce8f5;
    font-size:13px;
}

.container{
    max-width:460px;
    margin:25px auto;
    padding:0 15px;
}

.id-card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
}

.card-top{
    background:linear-gradient(
        135deg,
        #071a33,
        #123f70
    );
    color:white;
    text-align:center;
    padding:22px 18px;
}

.card-top h2{
    font-size:21px;
}

.card-top p{
    margin-top:5px;
    font-size:12px;
    color:#dce8f5;
}

.photo{
    width:110px;
    height:110px;
    margin:18px auto 5px;
    border-radius:50%;
    overflow:hidden;
    background:#e4ebf3;
    border:4px solid white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
}

.photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

.details{
    padding:20px;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:12px 0;
    border-bottom:1px solid #edf0f4;
    font-size:14px;
}

.label{
    color:#777;
}

.value{
    font-weight:bold;
    text-align:right;
    color:#172033;
}

.roll{
    background:#edf3f9;
    color:#0b3158;
    padding:13px;
    border-radius:10px;
    text-align:center;
    margin-top:17px;
    font-weight:bold;
    font-size:15px;
}

.status{
    text-align:center;
    margin-top:18px;
    color:#16803c;
    font-weight:bold;
}

.actions{
    padding:0 20px 22px;
}

button{
    width:100%;
    border:0;
    border-radius:10px;
    padding:13px;
    background:#0b3158;
    color:white;
    font-size:14px;
    font-weight:bold;
    margin-top:12px;
}

.back{
    display:block;
    text-align:center;
    margin:20px auto;
    color:#0b3158;
    text-decoration:none;
    font-weight:bold;
    font-size:14px;
}

.loading{
    text-align:center;
    padding:30px;
    color:#777;
}

.error{
    display:none;
    background:#fff0f0;
    color:#b00020;
    padding:15px;
    margin:20px;
    border-radius:10px;
    text-align:center;
    font-size:13px;
    line-height:1.6;
}

@media print{

    body{
        background:white;
    }

    .header,
    .back,
    .actions{
        display:none;
    }

    .container{
        margin:0 auto;
    }

    .id-card{
        box-shadow:none;
    }

}

</style>

</head>


<body>


<div class="header">

    <h1>
        NAS COMPUTER ACADEMY
    </h1>

    <p>
        Student Digital ID Card
    </p>

</div>


<div class="container">

<div class="id-card">


<div class="card-top">

    <h2>
        NAS COMPUTER ACADEMY
    </h2>

    <p>
        STUDENT IDENTITY CARD
    </p>


    <div class="photo">

        <span id="photoIcon">
            👨‍🎓
        </span>

        <img
            id="studentPhoto"
            alt="Student Photo"
        >

    </div>

</div>


<div
    class="loading"
    id="loading"
>
    Student details loading...
</div>


<div
    class="error"
    id="errorMessage"
></div>


<div
    class="details"
    id="studentDetails"
    style="display:none;"
>


    <div class="row">

        <span class="label">
            Student Name
        </span>

        <span
            class="value"
            id="studentName"
        >
            -
        </span>

    </div>


    <div class="row">

        <span class="label">
            Father's Name
        </span>

        <span
            class="value"
            id="fatherName"
        >
            -
        </span>

    </div>


    <div class="row">

        <span class="label">
            Course
        </span>

        <span
            class="value"
            id="course"
        >
            -
        </span>

    </div>


    <div class="row">

        <span class="label">
            Mobile
        </span>

        <span
            class="value"
            id="mobile"
        >
            -
        </span>

    </div>


    <div class="roll">

        Student ID / Roll No.<br>

        <span id="rollNo">
            -
        </span>

    </div>


    <div class="status">

        ✓ Active Student

    </div>

</div>


<div class="actions">

    <button
        onclick="window.print()"
    >
        🖨️ Print / Save ID Card
    </button>

</div>


</div>


<a
    href="student.html"
    class="back"
>
    ← Student Dashboard
</a>


</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
'https://ajfgbupabmykfhnaziee.supabase.co';

const SUPABASE_KEY =
'sb_publishable_-5AKwaHBuvhnYu-PwoF6NQ__auTupxV';

const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ELEMENTS
========================= */

const loading =
document.getElementById(
    "loading"
);

const details =
document.getElementById(
    "studentDetails"
);

const errorMessage =
document.getElementById(
    "errorMessage"
);


/* =========================
   LOGIN CHECK
========================= */

const rollNo =
localStorage.getItem(
    "studentRollNo"
);


if(!rollNo){

    window.location.href =
        "login.html";

}


/* =========================
   LOAD STUDENT
========================= */

async function loadStudent(){

    try{

        const result =
        await db
        .from("students")
        .select(
            "student_name,father_name,mobile,course,roll_no,photo_url"
        )
        .eq(
            "roll_no",
            rollNo
        )
        .maybeSingle();


        if(result.error){

            throw result.error;

        }


        if(!result.data){

            throw new Error(
                "Student record नहीं मिला।"
            );

        }


        const student =
            result.data;


        /* =====================
           DETAILS
        ===================== */

        document.getElementById(
            "studentName"
        ).innerText =
            student.student_name || "-";


        document.getElementById(
            "fatherName"
        ).innerText =
            student.father_name || "-";


        document.getElementById(
            "course"
        ).innerText =
            student.course || "-";


        document.getElementById(
            "mobile"
        ).innerText =
            student.mobile || "-";


        document.getElementById(
            "rollNo"
        ).innerText =
            student.roll_no || "-";


        /* =====================
           PHOTO
        ===================== */

        if(student.photo_url){

            const image =
            document.getElementById(
                "studentPhoto"
            );

            const icon =
            document.getElementById(
                "photoIcon"
            );


            image.src =
                student.photo_url;


            image.onload =
            function(){

                image.style.display =
                    "block";

                icon.style.display =
                    "none";

            };


            image.onerror =
            function(){

                icon.style.display =
                    "block";

            };

        }


        /* =====================
           SHOW CARD
        ===================== */

        loading.style.display =
            "none";

        details.style.display =
            "block";


    }
    catch(error){

        console.error(error);

        loading.style.display =
            "none";

        errorMessage.innerHTML =
            "Student details load नहीं हो सके।<br>" +
            error.message;

        errorMessage.style.display =
            "block";

    }

}


loadStudent();

</script>


</body>

</html>
