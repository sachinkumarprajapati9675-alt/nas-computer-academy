<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login - NAS Computer Academy</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#071a33,#123f70);
}

.login-card{
    width:100%;
    max-width:390px;
    background:white;
    border-radius:20px;
    padding:30px 25px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
    width:75px;
    height:75px;
    margin:0 auto 15px;
    border-radius:50%;
    background:#0b3158;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:bold;
}

h1{
    color:#0b3158;
    font-size:23px;
}

.subtitle{
    color:#777;
    font-size:13px;
    margin:8px 0 25px;
}

.google-btn{
    width:100%;
    padding:14px;
    border:1px solid #d9dfe7;
    border-radius:10px;
    background:white;
    color:#172033;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}

.google-btn:hover{
    background:#f7f9fb;
}

.google-icon{
    font-size:20px;
}

.status{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:9px;
    background:#fff0f0;
    color:#b00020;
    font-size:13px;
}

.note{
    margin-top:20px;
    color:#888;
    font-size:11px;
    line-height:1.5;
}
</style>
</head>

<body>

<div class="login-card">

    <div class="logo">
        NAS
    </div>

    <h1>
        Admin Login
    </h1>

    <div class="subtitle">
        NAS Computer Academy
    </div>

    <button
        class="google-btn"
        id="googleLogin"
        onclick="loginWithGoogle()"
    >
        <span class="google-icon">G</span>
        Continue with Google
    </button>

    <div
        class="status"
        id="status"
    ></div>

    <div class="note">
        केवल authorized administrator ही
        Admin Panel access कर सकता है।
    </div>

</div>


<script>

/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
'https://ajfgbupabmykfhnazie.supabase.co';

const SUPABASE_KEY =
'sb_publishable_-5AKwaHBuvhnYu-PwoF6NQ__auTupxV';

const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   CHECK EXISTING LOGIN
========================= */

async function checkLogin(){

    const {
        data
    } =
    await db.auth.getSession();

    if(
        data &&
        data.session
    ){

        window.location.replace(
            "admin.html"
        );

    }

}


/* =========================
   GOOGLE LOGIN
========================= */

async function loginWithGoogle(){

    const button =
        document.getElementById(
            "googleLogin"
        );

    const status =
        document.getElementById(
            "status"
        );


    button.disabled = true;

    button.innerHTML =
        "Google Login हो रहा है...";


    try{

        const {
            error
        } =
        await db.auth.signInWithOAuth({

            provider:"google",

            options:{

                redirectTo:
                    window.location.origin +
                    "/admin.html"

            }

        });


        if(error){

            throw error;

        }

    }
    catch(error){

        console.error(error);

        status.innerText =
            error.message;

        status.style.display =
            "block";

        button.disabled =
            false;

        button.innerHTML =
            '<span class="google-icon">G</span> Continue with Google';

    }

}


checkLogin();

</script>

</body>
</html>
